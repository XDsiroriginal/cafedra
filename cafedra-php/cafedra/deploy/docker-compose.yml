services:
    app:
        build:
            context: ../
            dockerfile: Dockerfile
        container_name: laravel_app
        volumes:
            - ../:/var/www/html
        working_dir: /var/www/html
        networks:
            - laravel_network
        depends_on:
            db:
                condition: service_healthy

    webserver:
        image: nginx:alpine
        container_name: nginx_server
        ports:
            - "8000:80"
        volumes:
            - ../:/var/www/html
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - laravel_network
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: mysql_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: shop_db
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: shop_user
            MYSQL_PASSWORD: shop_password
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - laravel_network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
            timeout: 20s
            retries: 10

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: pma
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "8080:80"
        networks:
            - laravel_network
        depends_on:
            db:
                condition: service_healthy

volumes:
    db_data:

networks:
    laravel_network:
        driver: bridge
